theorem Inkproof.Demos.Boxes.quantile_eq : ∀ (xs : Array Rat) (p : Rat), Inkproof.Demos.Boxes.quantile xs p = have pos := p * (↑xs.size - 1); have i := pos.floor.toNat; xs.getD i 0 + (pos - ↑i) * (xs.getD (i + 1) (xs.getD i 0) - xs.getD i 0)
