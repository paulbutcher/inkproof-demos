theorem Inkproof.Demos.Zoom.Chart.config_eq : ∀ (c : Inkproof.Demos.Zoom.Chart), c.config = have f := c.frame; have axis := fun length r => have span := (r.snd - r.fst).toFloat; { length := length.toFloat, minSpan := span / 1000, maxSpan := span, home := { start := r.fst.toFloat, span := span }, keyZoom := 5 / 4, keyPan := 1 / 10 }; { x := axis (f.right - f.left) f.xs, y := axis (f.bottom - f.top) f.ys }
