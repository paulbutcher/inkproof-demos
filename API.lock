theorem Inkproof.Demos.Zoom.Chart.frame_eq : ∀ (c : Inkproof.Demos.Zoom.Chart), c.frame = Inkproof.Demos.Frame.sized c.width c.height c.ranges.fst c.ranges.snd
field Inkproof.Demos.Zoom.Chart.height : Inkproof.Demos.Zoom.Chart → Nat
def Inkproof.Demos.Zoom.Chart.lineData : Inkproof.Demos.Zoom.Chart → Inkproof.Demos.Zoom.Line → Inkproof.Scene.DisplayList
theorem Inkproof.Demos.Zoom.Chart.lineData_eq : ∀ (c : Inkproof.Demos.Zoom.Chart) (l : Inkproof.Demos.Zoom.Line), c.lineData l = (Option.map (fun f => Inkproof.Scene.compileArea { color := f } c.ranges.snd.fst { x := id, y := id } (Inkproof.Core.Segmented.single (Inkproof.Demos.Lines.series l.xs (Array.map Option.some l.ys)))) do let a ← l.fill Pure.pure (Inkproof.Scene.Shading.flat a)).getD #[] ++ Inkproof.Scene.compileLine { paint := { layer := 1, color := Inkproof.Scene.Shading.flat l.color }, halfWidth := Inkproof.Demos.Axes.strokeHalfWidth } { x := id, y := id } (Inkproof.Core.Segmented.single (Inkproof.Demos.Lines.series l.xs (Array.map Option.some l.ys)))
field Inkproof.Demos.Zoom.Chart.lines : Inkproof.Demos.Zoom.Chart → List Inkproof.Demos.Zoom.Line
def Inkproof.Demos.Zoom.Chart.markData : Inkproof.Demos.Zoom.Chart → Inkproof.Scene.DisplayList
theorem Inkproof.Demos.Zoom.Chart.markData_eq : ∀ (c : Inkproof.Demos.Zoom.Chart), c.markData = Array.map (fun m => { layer := 0, color := Inkproof.Scene.Shading.flat m.fill, shape := Inkproof.Scene.Shape.rect { x0 := m.start, y0 := c.ranges.snd.fst, x1 := m.stop, y1 := c.ranges.snd.snd } }) (List.filter (fun m => Decidable.decide (m.start < m.stop)) c.marks).toArray
def Inkproof.Demos.Zoom.Chart.markTexts : Inkproof.Demos.Zoom.Chart → Inkproof.Demos.Frame → (String → Float × Float) → List (String × Rat × Rat)
theorem Inkproof.Demos.Zoom.Chart.markTexts_eq : ∀ (c : Inkproof.Demos.Zoom.Chart) (f : Inkproof.Demos.Frame) (measure : String → Float × Float), c.markTexts f measure = List.filterMap (fun m => Option.map (fun b => (m.label, b.x0 + 5, b.y0 + 3)) (Inkproof.Demos.Zoom.Mark.box f measure m)) (List.filter (fun m => Inkproof.Demos.Zoom.Mark.shown f m && Decidable.decide (f.left ≤ (Inkproof.Demos.Zoom.Mark.columns f m).fst) && Decidable.decide ((Inkproof.Demos.Zoom.Mark.columns f m).fst ≤ f.right)) c.marks)
field Inkproof.Demos.Zoom.Chart.marks : Inkproof.Demos.Zoom.Chart → List Inkproof.Demos.Zoom.Mark
constructor Inkproof.Demos.Zoom.Chart.mk : Nat → Nat → List Inkproof.Demos.Zoom.Line → Option ((Rat × Rat) × Rat × Rat) → List Inkproof.Demos.Zoom.Mark → String → Inkproof.Demos.Zoom.Chart
def Inkproof.Demos.Zoom.Chart.pieces : Inkproof.Demos.Zoom.Chart → Array Inkproof.Scene.DisplayList
theorem Inkproof.Demos.Zoom.Chart.pieces_eq : ∀ (c : Inkproof.Demos.Zoom.Chart), c.pieces = #[c.markData] ++ Array.map c.lineData c.lines.toArray
def Inkproof.Demos.Zoom.Chart.ranges : Inkproof.Demos.Zoom.Chart → (Rat × Rat) × Rat × Rat
theorem Inkproof.Demos.Zoom.Chart.ranges_eq : ∀ (c : Inkproof.Demos.Zoom.Chart), c.ranges = c.bounds.getD (match List.flatMap (fun x => x.xs.toList) c.lines, List.flatMap (fun x => x.ys.toList) c.lines with | x :: xs, y :: ys => ((List.foldl Min.min x xs, List.foldl Max.max x xs), Inkproof.Scale.autoRange (1 / 10) (List.foldl Min.min y ys) (List.foldl Max.max y ys)) | x, x_1 => ((0, 1), 0, 1))
def Inkproof.Demos.Zoom.Chart.retain : Inkproof.Demos.Zoom.Chart → Rat → Array Inkproof.Gpu.Layer
theorem Inkproof.Demos.Zoom.Chart.retain_eq : ∀ (c : Inkproof.Demos.Zoom.Chart) (k : Rat), c.retain k = Array.map (fun d => Inkproof.Gpu.Layer.stroke (Inkproof.Scene.DisplayList.scaleSizes k d)) c.pieces
field Inkproof.Demos.Zoom.Chart.unit : Inkproof.Demos.Zoom.Chart → String
def Inkproof.Demos.Zoom.Chart.viewFrame : Inkproof.Demos.Zoom.Chart → Inkproof.Viewport.View Float → Inkproof.Demos.Frame
theorem Inkproof.Demos.Zoom.Chart.viewFrame_eq : ∀ (c : Inkproof.Demos.Zoom.Chart) (v : Inkproof.Viewport.View Float), c.viewFrame v = have f := c.frame; have range := fun s d => ((Inkproof.Float.Float.toRat s.start).getD d.fst, (Inkproof.Float.Float.toRat (s.start + s.span)).getD d.snd); { left := f.left, right := f.right, top := f.top, bottom := f.bottom, xs := range v.x f.xs, ys := range v.y f.ys }
field Inkproof.Demos.Zoom.Chart.width : Inkproof.Demos.Zoom.Chart → Nat
structure Inkproof.Demos.Zoom.Line : Type
field Inkproof.Demos.Zoom.Line.color : Inkproof.Demos.Zoom.Line → Inkproof.Scene.Color
field Inkproof.Demos.Zoom.Line.fill : Inkproof.Demos.Zoom.Line → Option Inkproof.Scene.Color
constructor Inkproof.Demos.Zoom.Line.mk : Array Rat → Array Rat → Inkproof.Scene.Color → Option Inkproof.Scene.Color → Inkproof.Demos.Zoom.Line
field Inkproof.Demos.Zoom.Line.xs : Inkproof.Demos.Zoom.Line → Array Rat
field Inkproof.Demos.Zoom.Line.ys : Inkproof.Demos.Zoom.Line → Array Rat
structure Inkproof.Demos.Zoom.Mark : Type
field Inkproof.Demos.Zoom.Mark.atTop : Inkproof.Demos.Zoom.Mark → Bool
def Inkproof.Demos.Zoom.Mark.box : Inkproof.Demos.Frame → (String → Float × Float) → Inkproof.Demos.Zoom.Mark → Option Inkproof.Scene.Rect
theorem Inkproof.Demos.Zoom.Mark.box_eq : ∀ (f : Inkproof.Demos.Frame) (measure : String → Float × Float) (m : Inkproof.Demos.Zoom.Mark), Inkproof.Demos.Zoom.Mark.box f measure m = match measure m.label with | (w, h) => match Inkproof.Float.Float.toRat w, Inkproof.Float.Float.toRat h with | Option.some w, Option.some h => match (w + 10, h + 6) with | (w, h) => have x := (Inkproof.Demos.Zoom.Mark.columns f m).fst; Option.some (if m.atTop = Bool.true then { x0 := x, y0 := f.top, x1 := x + w, y1 := f.top + h } else { x0 := x, y0 := f.bottom - h, x1 := x + w, y1 := f.bottom }) | x, x_1 => Option.none
def Inkproof.Demos.Zoom.Mark.columns : Inkproof.Demos.Frame → Inkproof.Demos.Zoom.Mark → Rat × Rat
theorem Inkproof.Demos.Zoom.Mark.columns_eq : ∀ (f : Inkproof.Demos.Frame) (m : Inkproof.Demos.Zoom.Mark), Inkproof.Demos.Zoom.Mark.columns f m = ({ domainStart := f.xs.fst, domainEnd := f.xs.snd, rangeStart := f.left, rangeEnd := f.right }.map m.start, { domainStart := f.xs.fst, domainEnd := f.xs.snd, rangeStart := f.left, rangeEnd := f.right }.map m.stop)
def Inkproof.Demos.Zoom.Mark.commands : Inkproof.Demos.Frame → (String → Float × Float) → Inkproof.Demos.Zoom.Mark → Inkproof.Scene.DisplayList
theorem Inkproof.Demos.Zoom.Mark.commands_eq : ∀ (f : Inkproof.Demos.Frame) (measure : String → Float × Float) (m : Inkproof.Demos.Zoom.Mark), Inkproof.Demos.Zoom.Mark.commands f measure m = match Inkproof.Demos.Zoom.Mark.columns f m with | (a, b) => if (!Inkproof.Demos.Zoom.Mark.shown f m) = Bool.true then #[] else Inkproof.Scene.DisplayList.clip (Inkproof.Demos.plot f) ((if m.start < m.stop then Inkproof.Demos.Pane.line m.stroke 2 (Option.some { on := 5, off := 5 }) b f.top b f.bottom else #[]) ++ Inkproof.Demos.Pane.line m.stroke 2 (Option.some { on := 5, off := 5 }) a f.top a f.bottom ++ (Option.map (Inkproof.Demos.Pane.outlined 3 m.stroke m.fill 2) (Inkproof.Demos.Zoom.Mark.box f measure m)).getD #[])
field Inkproof.Demos.Zoom.Mark.fill : Inkproof.Demos.Zoom.Mark → Inkproof.Scene.Color
field Inkproof.Demos.Zoom.Mark.label : Inkproof.Demos.Zoom.Mark → String
constructor Inkproof.Demos.Zoom.Mark.mk : Rat → Rat → String → Inkproof.Scene.Color → Inkproof.Scene.Color → Bool → Inkproof.Demos.Zoom.Mark
def Inkproof.Demos.Zoom.Mark.shown : Inkproof.Demos.Frame → Inkproof.Demos.Zoom.Mark → Bool
theorem Inkproof.Demos.Zoom.Mark.shown_eq : ∀ (f : Inkproof.Demos.Frame) (m : Inkproof.Demos.Zoom.Mark), Inkproof.Demos.Zoom.Mark.shown f m = (Decidable.decide (m.start ≤ f.xs.snd) && Decidable.decide (f.xs.fst ≤ m.stop))
