theorem Inkproof.Demos.Data.next_within : ∀ (lo hi : Rat) (acc : Rat × StdGen), lo ≤ acc.fst ∧ acc.fst ≤ hi → lo ≤ (Inkproof.Demos.Data.next lo hi acc).fst ∧ (Inkproof.Demos.Data.next lo hi acc).fst ≤ hi
