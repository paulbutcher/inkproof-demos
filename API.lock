theorem Inkproof.Demos.Boxes.commands_eq : ∀ (p : Inkproof.Demos.Pane.Pane) (i : Nat) (b : Inkproof.Demos.Boxes.Box), Inkproof.Demos.Boxes.commands p i b = have r := Inkproof.Demos.Boxes.body p i b; match (p.row p.left b.min, p.row p.left b.max) with | (lo, hi) => have cap := fun y => Inkproof.Demos.Pane.line Inkproof.Demos.Boxes.black 2 Option.none r.x0 y r.x1 y; Inkproof.Demos.Pane.line Inkproof.Demos.Boxes.black 2 (Option.some { on := 4, off := 4 }) (p.centre i) hi (p.centre i) lo ++ #[{ layer := 1, color := Inkproof.Scene.Shading.flat Inkproof.Demos.Boxes.black, shape := Inkproof.Scene.Shape.rect r }, { layer := 1, color := Inkproof.Scene.Shading.flat Inkproof.Demos.Boxes.grey, shape := Inkproof.Scene.Shape.rect { x0 := r.x0 + 1, y0 := r.y0 + 1, x1 := r.x1 - 1, y1 := r.y1 - 1 } }, { layer := 3, color := Inkproof.Scene.Shading.flat Inkproof.Demos.Boxes.black, shape := Inkproof.Scene.Shape.rect (Inkproof.Demos.Boxes.medianBar p i b) }] ++ cap hi ++ cap lo ++ Array.map (fun v => { layer := 3, color := Inkproof.Scene.Shading.flat Inkproof.Demos.Boxes.black, shape := Inkproof.Scene.Shape.marker Inkproof.Scene.MarkerShape.square { x := p.centre i, y := p.row p.left v } 4 }) b.outliers
