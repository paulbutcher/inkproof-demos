def Inkproof.Demos.Zoom.legendNames : String → List String
theorem Inkproof.Demos.Zoom.legendNames_eq : ∀ (page : String), Inkproof.Demos.Zoom.legendNames page = if (page == "zoom-wheel" || page == "zoom-touch") = Bool.true then ["One", "Two"] else []
def Inkproof.Demos.Zoom.variation : Inkproof.Demos.Zoom.Chart
def Inkproof.Demos.axes : Inkproof.Demos.Frame → (String → Float × Float) → List Inkproof.Scene.AxisDrawing
def Inkproof.Demos.axesWith : String → Inkproof.Demos.Frame → (String → Float × Float) → List Inkproof.Scene.AxisDrawing
theorem Inkproof.Demos.axesWith_eq : ∀ (unit : String) (f : Inkproof.Demos.Frame) (measure : String → Float × Float), Inkproof.Demos.axesWith unit f measure = if unit.isEmpty = Bool.true then Inkproof.Demos.axes f measure else match Inkproof.Demos.Axes.spacedTicks f.ys.fst.toFloat f.ys.snd.toFloat f.yExtent Inkproof.Demos.Axes.ySpacing unit with | (ts, ls) => [Inkproof.Scene.compileLinearAxis Inkproof.Scene.Side.bottom (Inkproof.Demos.plot f) f.xScale Inkproof.Demos.Axes.spec measure Inkproof.Demos.Axes.style, Inkproof.Scene.compilePixelAxis Inkproof.Scene.Side.left (Inkproof.Demos.plot f) Inkproof.Demos.Axes.style measure Inkproof.Demos.Axes.spec.labelGap (List.map f.yScale.map ts) ls]
theorem Inkproof.Demos.axes_eq : ∀ (f : Inkproof.Demos.Frame) (measure : String → Float × Float), Inkproof.Demos.axes f measure = [Inkproof.Scene.compileLinearAxis Inkproof.Scene.Side.bottom (Inkproof.Demos.plot f) f.xScale Inkproof.Demos.Axes.spec measure Inkproof.Demos.Axes.style, Inkproof.Scene.compileLinearAxis Inkproof.Scene.Side.left (Inkproof.Demos.plot f) f.yScale Inkproof.Demos.Axes.spec measure Inkproof.Demos.Axes.style]
def Inkproof.Demos.axisDisplay : Inkproof.Demos.Frame → (String → Float × Float) → Inkproof.Scene.DisplayList
def Inkproof.Demos.axisDisplayWith : String → Inkproof.Demos.Frame → (String → Float × Float) → Inkproof.Scene.DisplayList
theorem Inkproof.Demos.axisDisplayWith_eq : ∀ (unit : String) (f : Inkproof.Demos.Frame) (measure : String → Float × Float), Inkproof.Demos.axisDisplayWith unit f measure = List.foldl (fun x1 x2 => x1 ++ x2.display) #[] (Inkproof.Demos.axesWith unit f measure)
theorem Inkproof.Demos.axisDisplay_eq : ∀ (f : Inkproof.Demos.Frame) (measure : String → Float × Float), Inkproof.Demos.axisDisplay f measure = List.foldl (fun x1 x2 => x1 ++ x2.display) #[] (Inkproof.Demos.axes f measure)
def Inkproof.Demos.background : Inkproof.Scene.Color
def Inkproof.Demos.plot : Inkproof.Demos.Frame → Inkproof.Scene.Rect
theorem Inkproof.Demos.plot_eq : ∀ (f : Inkproof.Demos.Frame), Inkproof.Demos.plot f = { x0 := f.left, y0 := f.top, x1 := f.right, y1 := f.bottom }
def Inkproof.Demos.projection : Inkproof.Demos.Frame → Inkproof.Scene.Projection Rat Rat
theorem Inkproof.Demos.projection_x : ∀ (f : Inkproof.Demos.Frame) (x : Rat), (Inkproof.Demos.projection f).x x = { domainStart := f.xs.fst, domainEnd := f.xs.snd, rangeStart := f.left, rangeEnd := f.right }.map x
theorem Inkproof.Demos.projection_y : ∀ (f : Inkproof.Demos.Frame) (y : Rat), (Inkproof.Demos.projection f).y y = { domainStart := f.ys.fst, domainEnd := f.ys.snd, rangeStart := f.bottom, rangeEnd := f.top }.map y
def Inkproof.Demos.texts : Inkproof.Demos.Frame → Array String
def Inkproof.Demos.textsWith : String → Inkproof.Demos.Frame → Array String
theorem Inkproof.Demos.textsWith_eq : ∀ (unit : String) (f : Inkproof.Demos.Frame), Inkproof.Demos.textsWith unit f = Inkproof.Demos.texts f ++ (Inkproof.Demos.Axes.spacedTicks f.ys.fst.toFloat f.ys.snd.toFloat f.yExtent Inkproof.Demos.Axes.ySpacing unit).snd.toArray
theorem Inkproof.Demos.texts_eq : ∀ (f : Inkproof.Demos.Frame), Inkproof.Demos.texts f = (Inkproof.Demos.Axes.linearLabels f.xs.fst.toFloat f.xs.snd.toFloat ++ Inkproof.Demos.Axes.linearLabels f.ys.fst.toFloat f.ys.snd.toFloat).toArray
