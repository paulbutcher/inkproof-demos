<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Zoom with reset</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>inkproof-chart { display: block; width: 600px; height: 400px; margin-bottom: 20px; }</style>
    <script type="module" src="./main.js"></script>
  </head>
  <body>
    <h1>Zoom with reset</h1>
    <p><a href="../">All demos</a></p>
    <p>Zoom and pan as on the wheel zoom page, then return to the full range exactly with the button, or with <code>0</code> or Escape while the chart has focus.</p>
    <inkproof-chart id="chart" src="zoom-reset-range"></inkproof-chart>
    <p><button data-reset="chart">Reset zoom</button></p>
  </body>
</html>
