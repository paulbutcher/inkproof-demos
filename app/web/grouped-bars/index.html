<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Grouped and stacked bars</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
      inkproof-chart { display: inline-block; vertical-align: top; }
      figure { display: inline-block; margin: 0 0 8px 0; vertical-align: top; }
      figure p { margin: 4px 0; width: 0; min-width: 100%; }
    </style>
    <script type="module" src="./main.js"></script>
  </head>
  <body>
    <h1>Grouped and stacked bars</h1>
    <p><a href="../">All demos</a></p>
    <figure><p>Several groups of several bars each, side by side within each group.</p><inkproof-chart src="multi-grouped" number-format="en" legend="below-center static" style="width: 800px; height: 400px"></inkproof-chart></figure>
    <figure><p>The same bars stacked within each group, so the scale grows to fit the tallest stack.</p><inkproof-chart src="multi-stacked" number-format="en" legend="below-center static" style="width: 800px; height: 400px"></inkproof-chart></figure>
    <br>
    <figure><p>The grouped bars laid out sideways.</p><inkproof-chart src="multi-grouped-horizontal" number-format="en" legend="below-center static" style="width: 400px; height: 800px"></inkproof-chart></figure>
    <figure><p>The stacked bars laid out sideways.</p><inkproof-chart src="multi-stacked-horizontal" number-format="en" legend="below-center static" style="width: 400px; height: 800px"></inkproof-chart></figure>
    <br>
    <figure><p>Several groups with one bar each, so grouping makes no difference.</p><inkproof-chart src="one-bar-grouped" legend="below-center static" style="width: 800px; height: 400px"></inkproof-chart></figure>
    <figure><p>Several groups with one bar each, stacked, which looks the same as grouped.</p><inkproof-chart src="one-bar-stacked" legend="below-center static" style="width: 800px; height: 400px"></inkproof-chart></figure>
    <br>
    <figure><p>A single group of several bars, side by side.</p><inkproof-chart src="one-group-grouped" legend="below-center static" style="width: 800px; height: 400px"></inkproof-chart></figure>
    <figure><p>A single group of several bars, stacked into one column.</p><inkproof-chart src="one-group-stacked" legend="below-center static" style="width: 800px; height: 400px"></inkproof-chart></figure>
    <br>
    <figure><p>The smallest case: one group with one bar.</p><inkproof-chart src="single-grouped" legend="below-center static" style="width: 800px; height: 400px"></inkproof-chart></figure>
    <figure><p>The smallest case again, stacked.</p><inkproof-chart src="single-stacked" legend="below-center static" style="width: 800px; height: 400px"></inkproof-chart></figure>
    <br>
  </body>
</html>
