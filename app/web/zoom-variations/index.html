<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Zoom variations</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>inkproof-chart { display: block; width: 600px; height: 400px; margin-bottom: 20px; }</style>
    <script type="module" src="./main.js"></script>
  </head>
  <body>
    <h1>Zoom variations</h1>
    <p><a href="../">All demos</a></p>
    <p>Drag a box on a chart to zoom to it; the chart's <code>box-zoom</code> attribute chooses which axes the box covers, and <code>box-min</code> the least drag in pixels that counts. Shift-drag pans, and the wheel zooms.</p>
    <h2>Basic</h2>
    <figure><p>Drag a box to zoom: x only.</p><inkproof-chart interaction="drag-box box-x" src="variation-0" legend aria-label="X only"></inkproof-chart></figure>
    <figure><p>Drag a box to zoom: y only.</p><inkproof-chart interaction="drag-box box-y" src="variation-1" legend aria-label="Y only"></inkproof-chart></figure>
    <figure><p>The box zooms the axis the drag is longer along.</p><inkproof-chart interaction="drag-box box-auto" src="variation-2" legend aria-label="X or Y (adaptive)"></inkproof-chart></figure>
    <figure><p>The box zooms both axes to exactly the box you draw.</p><inkproof-chart interaction="drag-box box-xy" src="variation-3" legend aria-label="X or Y (omni)"></inkproof-chart></figure>
    <figure><p>Set up as the chart above: Inkproof has no separate mode for uPlot's adaptive and omni combined, so this repeats it.</p><inkproof-chart interaction="drag-box box-auto" src="variation-4" legend aria-label="X or Y (adaptive + omni)"></inkproof-chart></figure>
    <h2>With a minimum drag distance of 10 px</h2>
    <figure><p>Zoom x only; a drag shorter than 10 pixels is ignored.</p><inkproof-chart interaction="drag-box box-x 10px" src="variation-5" legend></inkproof-chart></figure>
    <figure><p>Zoom y only; a drag shorter than 10 pixels is ignored.</p><inkproof-chart interaction="drag-box box-y 10px" src="variation-6" legend></inkproof-chart></figure>
    <figure><p>Zoom the axis the drag is longer along; a drag shorter than 10 pixels is ignored.</p><inkproof-chart interaction="drag-box box-auto 10px" src="variation-7" legend></inkproof-chart></figure>
    <figure><p>Zoom both axes; a drag shorter than 10 pixels is ignored.</p><inkproof-chart interaction="drag-box box-xy 10px" src="variation-8" legend></inkproof-chart></figure>
    <figure><p>Again the longer axis, repeating the third with the same minimum.</p><inkproof-chart interaction="drag-box box-auto 10px" src="variation-9" legend></inkproof-chart></figure>
  </body>
</html>
