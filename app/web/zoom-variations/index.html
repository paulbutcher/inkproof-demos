<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Zoom variations</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>inkproof-chart { display: block; width: 600px; height: 400px; margin-bottom: 20px; }</style>
    <script type="module" src="./main.js"></script>
  </head>
  <body>
    <h1>Zoom variations</h1>
    <p><a href="../">All demos</a></p>
    <p>Drag a box on a chart to zoom to it; the chart's <code>box-zoom</code> attribute chooses which axes the box covers, and <code>box-min</code> the least drag in pixels that counts. Shift-drag pans, and the wheel zooms.</p>
    <h2>Basic</h2>
    <inkproof-chart src="variation-0" drag="box" box-zoom="x" aria-label="X only"></inkproof-chart>
    <inkproof-chart src="variation-1" drag="box" box-zoom="y" aria-label="Y only"></inkproof-chart>
    <inkproof-chart src="variation-2" drag="box" box-zoom="auto" aria-label="X or Y (adaptive)"></inkproof-chart>
    <inkproof-chart src="variation-3" drag="box" box-zoom="xy" aria-label="X or Y (omni)"></inkproof-chart>
    <inkproof-chart src="variation-4" drag="box" box-zoom="auto" aria-label="X or Y (adaptive + omni)"></inkproof-chart>
    <h2>With a minimum drag distance of 10 px</h2>
    <inkproof-chart src="variation-5" drag="box" box-zoom="x" box-min="10"></inkproof-chart>
    <inkproof-chart src="variation-6" drag="box" box-zoom="y" box-min="10"></inkproof-chart>
    <inkproof-chart src="variation-7" drag="box" box-zoom="auto" box-min="10"></inkproof-chart>
    <inkproof-chart src="variation-8" drag="box" box-zoom="xy" box-min="10"></inkproof-chart>
    <inkproof-chart src="variation-9" drag="box" box-zoom="auto" box-min="10"></inkproof-chart>
  </body>
</html>
