<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Log Scales</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>inkproof-chart { display: block; }</style>
    <script type="module" src="./main.js"></script>
  </head>
  <body>
    <h1>Log Scales</h1>
    <p><a href="../">All demos</a></p>
    <p>The player counts of several servers on a logarithmic scale, where each gridline is ten times the one below, so small and large counts are both readable.</p>
    <inkproof-chart chart-title="Log Y Scale" src="log" legend="below-center" style="width: 1600px; height: 600px"></inkproof-chart>
    <p>The same counts on an ordinary scale, where the largest values dominate and the small ones flatten along the bottom.</p>
    <inkproof-chart chart-title="Linear Y Scale" src="linear" legend="below-center" style="width: 1600px; height: 600px"></inkproof-chart>
  </body>
</html>
