<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Custom Scales</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>inkproof-chart { display: block; }</style>
    <script type="module" src="./main.js"></script>
  </head>
  <body>
    <h1>Custom Scales</h1>
    <p><a href="../">All demos</a></p>
    <figure><p>Two bounds and a fitted curve, with a square at each observation, on ordinary scales.</p><inkproof-chart src="linear" legend="below-center" style="width: 800px; height: 800px"></inkproof-chart></figure>
    <figure><p>The same data with both axes logarithmic.</p><inkproof-chart src="log" legend="below-center" style="width: 800px; height: 800px"></inkproof-chart></figure>
    <figure><p>The same data with a logarithmic x axis and a y axis that stretches probabilities so a Weibull distribution plots as a straight line.</p><inkproof-chart src="weibull" legend="below-center" style="width: 800px; height: 800px"></inkproof-chart></figure>
  </body>
</html>
