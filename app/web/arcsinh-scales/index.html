<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <title>ArcSinh Scales</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>inkproof-chart { display: block; }</style>
    <script type="module" src="./main.js"></script>
  </head>
  <body>
    <h1>ArcSinh Scales</h1>
    <p><a href="../">All demos</a></p>
    <label id="thresh-label" for="linthresh">Linear threshold: 1</label>
    <br>
    <input type="range" id="linthresh" name="linthresh" min="-3" max="3" value="0" step="1">
    <p>Values from a thousandth to a thousand, positive and negative, on a scale that is straight near zero and logarithmic far from it, so one chart shows both. The slider moves how far from zero it stays straight.</p>
    <inkproof-chart src="arcsinh" cursor="xy" legend style="width: 1600px; height: 600px"></inkproof-chart>
  </body>
</html>
